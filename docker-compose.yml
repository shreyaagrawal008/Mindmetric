services:
  mysql:
    image: mysql:8.4
    container_name: mindmetric-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: mindmetric
      MYSQL_USER: mindmetric
      MYSQL_PASSWORD: mindmetric
      MYSQL_ROOT_PASSWORD: mindmetric_root
    ports:
      - "3307:3306"
    volumes:
      - mindmetric_mysql:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./db/word_nebula_seed.sql:/docker-entrypoint-initdb.d/02-word-nebula-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-umindmetric", "-pmindmetric"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
    container_name: mindmetric-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/mindmetric?allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: mindmetric
      SPRING_DATASOURCE_PASSWORD: mindmetric
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-YOUR_GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:5173}
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com}
    container_name: mindmetric-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mindmetric_mysql:
