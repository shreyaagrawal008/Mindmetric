  </defs>
  <circle cx="80" cy="80" r="68" fill="url(#planet)" filter="url(#glow)"/>
  <ellipse cx="80" cy="84" rx="74" ry="18" fill="none" stroke="#ffffff" stroke-opacity="0.48" stroke-width="8" transform="rotate(-13 80 84)"/>
  <circle cx="46" cy="38" r="8" fill="#ffffff" fill-opacity="0.55"/>
