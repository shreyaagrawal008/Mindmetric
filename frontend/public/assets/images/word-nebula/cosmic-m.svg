<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="M illustration">
  <defs>
    <radialGradient id="planet" cx="34%" cy="24%" r="78%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="0.22" stop-color="#fda4af"/>
      <stop offset="0.62" stop-color="#ef4444"/>
      <stop offset="1" stop-color="#111827"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
