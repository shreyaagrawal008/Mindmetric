# Local development backend. Use 8081 to avoid common 8080 conflicts.
server.port=8081

# File-backed H2 database on D: project folder. Hibernate recreates tables on local startup
# so stale embedded data cannot poison JSON converters or seeded game payloads.
spring.datasource.url=jdbc:h2:file:./data/mindmetric;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.sql.init.mode=never

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Google OAuth token validation. Must match the frontend OAuth client id.
google.client.id=523502676584-bheonaj8jarnda1e6ejp0d07f1elit1m.apps.googleusercontent.com

auth.allowed-origins=http://localhost:5173,http://127.0.0.1:5173
logging.level.com.mindmetric=INFO
